version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao-php-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - webserver
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gestao_db
      - DB_USERNAME=gestao_user
      - DB_PASSWORD=gestao_password

  mysql:
    image: mysql:8.0
    container_name: gestao-php-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestao_db
      MYSQL_USER: gestao_user
      MYSQL_PASSWORD: gestao_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - webserver
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password

  nginx:
    image: nginx:1.21-alpine
    container_name: gestao-php-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/var/www
    networks:
      - webserver
    depends_on:
      - app

networks:
  webserver:
    driver: bridge

volumes:
  mysql_data:
